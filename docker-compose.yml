services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    profiles: [full]
    env_file: .env
    environment:
      DATABASE_URL: postgres://workbench:workbench@db:5432/workbench
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  pgdata:
